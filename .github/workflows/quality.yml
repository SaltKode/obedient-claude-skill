name: Skill quality

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.txt'
      - '**.py'
      - '**.json'
      - '.github/**'
      - '.gitattributes'
      - 'work-with-me.zip'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test installer and package tooling
        run: python -B -m unittest discover -s tools -p "test_*.py" -v
      - name: Validate skill, documentation, evaluations, and archive
        run: python -B tools/check_repository.py
